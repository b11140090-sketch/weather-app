<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101522">
    <meta name="description" content="查詢即時天氣與未來七日預報">
    <title>天氣 — 即時天氣與一週預報</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: #f4f7ff;
        background: #101522;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --muted: #aab4ca;
        --glass: rgba(255, 255, 255, 0.075);
        --line: rgba(255, 255, 255, 0.13);
        --accent: #9db8ff;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 12% 8%, rgba(80, 107, 190, 0.28), transparent 39rem),
          radial-gradient(ellipse at 92% 84%, rgba(40, 135, 160, 0.17), transparent 34rem),
          #101522;
      }

      button, input { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      a { color: inherit; }

      .shell { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 84px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand {
        color: #fff;
        font-size: 0.94rem;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-decoration: none;
      }

      .nav { display: flex; gap: 8px; align-items: center; }
      .nav a {
        padding: 10px 15px;
        border: 1px solid transparent;
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.9rem;
        text-decoration: none;
        transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
      }
      .nav a:hover, .nav a[aria-current="page"] {
        border-color: var(--line);
        background: var(--glass);
        color: #fff;
      }

      main { padding-block: 48px 72px; }
      .heading-row {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 25px;
      }
      .eyebrow {
        margin: 0 0 9px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.045em; }
      .subtitle { margin: 9px 0 0; color: var(--muted); line-height: 1.65; }

      .search { position: relative; z-index: 2; width: min(100%, 390px); }
      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 54px;
        padding: 0 17px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(21, 29, 47, 0.82);
        box-shadow: 0 12px 35px rgba(0,0,0,.15);
        backdrop-filter: blur(18px);
      }
      .search-box:focus-within { border-color: rgba(157, 184, 255, 0.65); }
      .search-icon { color: var(--muted); font-size: 1.2rem; }
      #city-search {
        width: 100%;
        min-width: 0;
        padding: 15px 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: #fff;
      }
      #city-search::placeholder { color: #8792a9; }
      .suggestions {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        left: 0;
        display: none;
        max-height: 320px;
        overflow-y: auto;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(21, 29, 47, 0.96);
        box-shadow: 0 18px 45px rgba(0,0,0,.3);
        backdrop-filter: blur(20px);
      }
      .suggestions.is-open { display: block; }
      .suggestion {
        display: block;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #f4f7ff;
        cursor: pointer;
        text-align: left;
      }
      .suggestion:hover, .suggestion:focus-visible { outline: 0; background: rgba(255,255,255,.09); }
      .suggestion small { display: block; margin-top: 3px; color: var(--muted); }

      .glass-card {
        border: 1px solid var(--line);
        background: linear-gradient(135deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
        box-shadow: 0 24px 70px rgba(0,0,0,.2);
        backdrop-filter: blur(20px);
      }

      .current-card {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(240px, .7fr);
        gap: 30px;
        overflow: hidden;
        padding: clamp(25px, 5vw, 48px);
        border-radius: 28px;
      }
      .current-card::before {
        position: absolute;
        top: -150px;
        right: 12%;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        background: rgba(104, 139, 255, 0.12);
        content: "";
        filter: blur(5px);
        pointer-events: none;
      }
      .current-main, .metrics { position: relative; z-index: 1; }
      .location-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .location-line h2 { margin: 0; font-size: clamp(1.45rem, 3vw, 2rem); }
      .local-date { margin: 8px 0 0; color: var(--muted); }
      .temperature-line { display: flex; align-items: center; gap: 18px; margin-top: 24px; }
      .weather-icon { font-size: clamp(3.2rem, 9vw, 5.4rem); line-height: 1; filter: drop-shadow(0 10px 18px rgba(0,0,0,.22)); }
      .temperature { font-size: clamp(4.4rem, 12vw, 7rem); font-weight: 300; letter-spacing: -0.08em; line-height: .95; }
      .temperature sup { margin-left: 5px; font-size: .34em; font-weight: 500; vertical-align: top; letter-spacing: 0; }
      .condition { margin: 13px 0 0; color: #d7def0; font-size: 1.08rem; }
      .feels-like { margin: 7px 0 0; color: var(--muted); }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: center;
        gap: 12px;
      }
      .metric {
        min-height: 105px;
        padding: 17px;
        border: 1px solid rgba(255,255,255,.09);
        border-radius: 17px;
        background: rgba(255,255,255,.045);
      }
      .metric-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .84rem; }
      .metric-value { display: block; margin-top: 12px; font-size: 1.55rem; font-weight: 650; }
      .metric-value small { color: var(--muted); font-size: .78rem; font-weight: 500; }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin: 37px 0 16px;
      }
      .section-heading h2 { margin: 0; font-size: 1.32rem; }
      .section-heading p { margin: 0; color: var(--muted); font-size: .88rem; }
      .forecast-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; }
      .forecast-day {
        min-width: 0;
        padding: 19px 12px;
        border-radius: 19px;
        text-align: center;
      }
      .forecast-date { margin: 0; color: var(--muted); font-size: .83rem; }
      .forecast-icon { display: block; margin: 15px 0; font-size: 2rem; }
      .forecast-condition { min-height: 2.6em; margin: 0; color: #d7def0; font-size: .78rem; line-height: 1.4; }
      .forecast-temps { display: flex; justify-content: center; gap: 9px; margin-top: 13px; font-weight: 650; }
      .forecast-temps span:last-child { color: var(--muted); font-weight: 500; }
      .rain-chance { margin: 10px 0 0; color: #9dc9ff; font-size: .76rem; }

      .status {
        min-height: 24px;
        margin: 13px 0 0;
        color: var(--muted);
        font-size: .9rem;
      }
      .status[data-state="error"] { color: #ffaaa8; }
      .status[data-state="loading"] { color: var(--accent); }
      .footer-note { margin: 20px 2px 0; color: #7f8ba3; font-size: .78rem; text-align: right; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      @media (max-width: 800px) {
        .heading-row { align-items: stretch; flex-direction: column; }
        .search { width: 100%; }
        .forecast-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      }
      @media (max-width: 620px) {
        .shell { width: min(100% - 28px, 1120px); }
        .topbar { min-height: 72px; }
        .brand { font-size: .8rem; }
        .nav { gap: 0; }
        .nav a { padding: 9px 10px; font-size: .8rem; }
        main { padding-block: 33px 52px; }
        .current-card { grid-template-columns: 1fr; gap: 26px; border-radius: 23px; }
        .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .metric { min-height: 94px; padding: 14px; }
        .section-heading { align-items: start; flex-direction: column; gap: 6px; margin-top: 30px; }
        .forecast-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .forecast-day { padding: 17px; }
        .footer-note { text-align: left; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="index.html">個人作品集</a>
        <nav class="nav" aria-label="主要導覽">
          <a href="index.html">返回首頁</a>
          <a href="weather.html" aria-current="page">天氣 App</a>
        </nav>
      </header>
      <main>
        <div class="heading-row">
          <div>
            <p class="eyebrow">LOCAL WEATHER</p>
            <h1>天氣概況</h1>
            <p class="subtitle">掌握此刻天氣，輕鬆規劃接下來的一週。</p>
          </div>
          <form class="search" id="search-form" role="search">
            <label class="sr-only" for="city-search">搜尋城市</label>
            <div class="search-box">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="city-search" name="city" type="search" placeholder="搜尋城市，例如：臺北" autocomplete="off" aria-controls="suggestions" aria-expanded="false">
            </div>
            <div class="suggestions" id="suggestions" role="listbox" aria-label="城市建議"></div>
          </form>
        </div>

        <p class="status" id="status" role="status" aria-live="polite" data-state="loading">正在載入天氣資料…</p>
        <section class="current-card glass-card" aria-labelledby="current-title">
          <div class="current-main">
            <div class="location-line">
              <h2 id="current-title">桃園市</h2>
            </div>
            <p class="local-date" id="local-date">—</p>
            <div class="temperature-line">
              <span class="weather-icon" id="current-icon" role="img" aria-label="天氣圖示">⛅</span>
              <div>
                <div class="temperature"><span id="temperature">--</span><sup>°C</sup></div>
                <p class="condition" id="condition">載入中</p>
                <p class="feels-like">體感溫度 <strong id="feels-like">--</strong>°C</p>
              </div>
            </div>
          </div>
          <div class="metrics" aria-label="目前天氣指標">
            <div class="metric">
              <span class="metric-label"><span aria-hidden="true">💧</span>濕度</span>
              <strong class="metric-value"><span id="humidity">--</span><small> %</small></strong>
            </div>
            <div class="metric">
              <span class="metric-label"><span aria-hidden="true">🌬️</span>風速</span>
              <strong class="metric-value"><span id="wind-speed">--</span><small> km/h</small></strong>
            </div>
            <div class="metric">
              <span class="metric-label"><span aria-hidden="true">☀️</span>紫外線指數</span>
              <strong class="metric-value"><span id="uv-index">--</span></strong>
            </div>
            <div class="metric">
              <span class="metric-label"><span aria-hidden="true">🌡️</span>體感溫度</span>
              <strong class="metric-value"><span id="feels-like-card">--</span><small> °C</small></strong>
            </div>
          </div>
        </section>

        <section aria-labelledby="forecast-title">
          <div class="section-heading">
            <h2 id="forecast-title">未來 7 日</h2>
            <p>每日最高與最低溫度</p>
          </div>
          <div class="forecast-grid" id="forecast-grid" aria-live="polite"></div>
        </section>
        <p class="footer-note">天氣資料由 Open-Meteo 提供</p>
      </main>
    </div>
    <script src="weather.js" defer></script>
  </body>
</html>
