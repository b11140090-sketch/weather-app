<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101522">
    <meta name="description" content="個人作品集與天氣資訊">
    <title>作品集 — 個人首頁</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: #f4f7ff;
        background: #101522;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --muted: #aab4ca;
        --glass: rgba(255, 255, 255, 0.075);
        --line: rgba(255, 255, 255, 0.13);
        --accent: #9db8ff;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 14% 9%, rgba(80, 107, 190, 0.27), transparent 38rem),
          radial-gradient(ellipse at 90% 84%, rgba(40, 135, 160, 0.16), transparent 34rem),
          #101522;
      }

      a { color: inherit; }

      .shell {
        width: min(1120px, calc(100% - 40px));
        margin-inline: auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 84px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand {
        color: #fff;
        font-size: 0.94rem;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-decoration: none;
      }

      .nav {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .nav a {
        padding: 10px 15px;
        border: 1px solid transparent;
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.9rem;
        text-decoration: none;
        transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
      }

      .nav a:hover, .nav a[aria-current="page"] {
        border-color: var(--line);
        background: var(--glass);
        color: #fff;
      }

      main {
        display: grid;
        min-height: calc(100vh - 85px);
        align-items: center;
        padding-block: 70px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: clamp(32px, 7vw, 82px);
        border: 1px solid var(--line);
        border-radius: 32px;
        background: linear-gradient(135deg, rgba(255,255,255,.11), rgba(255,255,255,.035));
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(22px);
      }

      .hero::after {
        position: absolute;
        top: -110px;
        right: -80px;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: rgba(116, 150, 255, 0.13);
        content: "";
        filter: blur(3px);
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-size: clamp(2.7rem, 8vw, 5.7rem);
        letter-spacing: -0.055em;
        line-height: 1.06;
      }

      .intro {
        max-width: 570px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.13rem);
        line-height: 1.8;
      }

      .hero-link {
        display: inline-flex;
        position: relative;
        z-index: 1;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        padding: 13px 19px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-weight: 650;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease;
      }

      .hero-link:hover { transform: translateY(-2px); background: rgba(255,255,255,.19); }
      .hero-link span { font-size: 1.2rem; }

      @media (max-width: 540px) {
        .shell { width: min(100% - 28px, 1120px); }
        .topbar { min-height: 72px; }
        .brand { font-size: 0.8rem; }
        .nav { gap: 0; }
        .nav a { padding: 9px 10px; font-size: 0.8rem; }
        .hero { border-radius: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="index.html">個人作品集</a>
        <nav class="nav" aria-label="主要導覽">
          <a href="index.html" aria-current="page">首頁</a>
          <a href="weather.html">天氣</a>
        </nav>
      </header>
      <main>
        <section class="hero" aria-labelledby="welcome-title">
          <p class="eyebrow">PERSONAL PORTFOLIO</p>
          <h1 id="welcome-title">你好，<br>歡迎來到我的網站。</h1>
          <p class="intro">探索我的個人作品集，或查看即時天氣與未來一週的預報。</p>
          <a class="hero-link" href="weather.html">探索天氣 App <span aria-hidden="true">→</span></a>
        </section>
      </main>
    </div>
  </body>
</html>
